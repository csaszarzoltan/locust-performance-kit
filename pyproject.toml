[project]
name = "locust-performance-kit"
version = "1.7.0"
description = "Production-ready Locust load testing templates for enterprise performance testing"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zoltan Csaszar" }]
readme = "README.md"
dependencies = [
    "locust>=2.20.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "flask==3.1.3",
    "gunicorn==23.0.0",
]

[project.scripts]
locust-report = "locust_templates.cli:main"
locust-gen = "locust_templates.cli_gen:main"
locust-kit = "locust_templates.cli_analyze:main"
locust-workspace = "locust_templates.workspace_cli:main"

[project.optional-dependencies]
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
websocket = [
    "websocket-client>=1.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-html>=3.2.0",
    "ruff>=0.4.0",
    "pyright[nodejs]>=1.1.360",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/**" = ["E501"]
"src/locust_templates/run_import.py" = ["E701", "E702"]
"src/locust_templates/decision_artifact.py" = ["E701", "E702", "E731", "SIM105"]
"src/locust_templates/analysis_service.py" = ["E701", "E702"]
"src/locust_templates/workspace_views.py" = ["E701", "E702"]
"src/locust_templates/workspace_api.py" = ["E701", "E702"]
"src/locust_templates/workspace_cli.py" = ["E701", "E702"]
"src/locust_templates/product_workspace.py" = ["E701", "E702"]
"tests/unit/test_run_import.py" = ["E701", "E702"]
"tests/unit/test_decision_artifact.py" = ["E701", "E702"]
"tests/unit/test_workspace_runs.py" = ["E701", "E702"]
"tests/integration/test_run_import_flow.py" = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "visual: Visual regression tests",
    "slow: Slow running tests",
]

[tool.setuptools.package-data]
locust_templates = ["static/*.css", "static/*.js", "sample/*.json", "sample/**/*.csv"]

[tool.pyright]
include = ["src/locust_templates/run_import.py", "src/locust_templates/decision_artifact.py", "src/locust_templates/comparison_view.py", "src/locust_templates/analysis_service.py", "src/locust_templates/workspace_views.py", "src/locust_templates/workspace_cli.py"]
extraPaths = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
