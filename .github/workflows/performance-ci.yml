name: Performance CI
'on': [push, pull_request]
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: locust -f examples/api_load_test.py --headless --users 10 --spawn-rate 1 --run-time 30s --host http://localhost:8080 --csv results
      - uses: actions/upload-artifact@v4
        with: {name: performance-results, path: 'results_*.csv'}
