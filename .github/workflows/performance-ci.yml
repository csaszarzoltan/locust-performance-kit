name: Performance CI
'on': [push, pull_request]
jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install .
      - run: locust -f locustfile.py --headless -u 10 -r 1 -t 30s --csv results/run
      - uses: actions/upload-artifact@v4
        with: {name: performance-results, path: results/}
