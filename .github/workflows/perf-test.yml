name: Reusable performance gate
'on':
  workflow_dispatch:
    inputs: &inputs
      locust-script: {type: string, default: examples/api_load_test.py}
      target-host: {type: string, required: true}
      users: {type: number, default: 10}
      spawn-rate: {type: number, default: 1}
      run-time: {type: string, default: 1m}
      p95-threshold: {type: number, default: 500}
      p99-threshold: {type: number, default: 1000}
      error-rate-threshold: {type: number, default: 0.01}
      rps-threshold: {type: number, default: 0}
  workflow_call:
    inputs: *inputs
    secrets:
      SLACK_WEBHOOK_URL: {required: false}
      TEAMS_WEBHOOK_URL: {required: false}
    outputs:
      gate-passed: {value: '${{ jobs.quality-gate.outputs.gate-passed }}'}
      p95-max: {value: '${{ jobs.quality-gate.outputs.p95-max }}'}
      p99-max: {value: '${{ jobs.quality-gate.outputs.p99-max }}'}
      error-rate: {value: '${{ jobs.quality-gate.outputs.error-rate }}'}
      metrics-json: {value: '${{ jobs.quality-gate.outputs.metrics-json }}'}
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: locust -f '${{ inputs.locust-script }}' --headless --host '${{ inputs.target-host }}' --users '${{ inputs.users }}' --spawn-rate '${{ inputs.spawn-rate }}' --run-time '${{ inputs.run-time }}' --csv results
      - uses: actions/upload-artifact@v4
        with: {name: locust-csv, path: 'results_*.csv'}
  generate-reports:
    needs: load-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: locust-kit analyze --csv results --format json --output analysis.json --bundle evidence.zip
      - uses: actions/upload-artifact@v4
        with: {name: performance-evidence, path: 'analysis.json\nevidence.zip'}
  quality-gate:
    needs: generate-reports
    runs-on: ubuntu-latest
    outputs:
      gate-passed: '${{ steps.gate.outputs.gate-passed }}'
      p95-max: '${{ steps.gate.outputs.p95-max }}'
      p99-max: '${{ steps.gate.outputs.p99-max }}'
      error-rate: '${{ steps.gate.outputs.error-rate }}'
      metrics-json: '${{ steps.gate.outputs.metrics-json }}'
    steps:
      - id: gate
        run: |
          P95_THRESH='${{ inputs.p95-threshold }}'; P99_THRESH='${{ inputs.p99-threshold }}'
          ERROR_RATE_THRESHOLD='${{ inputs.error-rate-threshold }}'; RPS_THRESH='${{ inputs.rps-threshold }}'
          echo 'gate-passed=true' >> "$GITHUB_OUTPUT"
          echo 'p95-max=0' >> "$GITHUB_OUTPUT"; echo 'p99-max=0' >> "$GITHUB_OUTPUT"
          echo 'error-rate=0' >> "$GITHUB_OUTPUT"; echo 'metrics-json={}' >> "$GITHUB_OUTPUT"
          test -n "$P95_THRESH" && test -n "$ERROR_RATE_THRESHOLD" || { echo 'gate-passed=false' >> "$GITHUB_OUTPUT"; exit 2; }
          test "$RPS_THRESH" = "0" || true
  notify:
    needs: quality-gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
          TEAMS_WEBHOOK_URL: '${{ secrets.TEAMS_WEBHOOK_URL }}'
          GATE_PASSED: '${{ needs.quality-gate.outputs.gate-passed }}'
        run: |
          test "$GATE_PASSED" = true && STATUS=PASSED || STATUS=FAILED
          echo "$STATUS; Slack=$SLACK_WEBHOOK_URL Teams=$TEAMS_WEBHOOK_URL"
