name: Performance quality gate
'on':
  workflow_dispatch:
    inputs:
      locust-script: {type: string, required: true, default: locustfile.py}
      target-host: {type: string, required: true}
      users: {type: number, default: 10}
      spawn-rate: {type: number, default: 1}
      run-time: {type: string, default: 1m}
      p95-threshold: {type: number, default: 500}
      p99-threshold: {type: number, default: 1000}
      error-rate-threshold: {type: number, default: 0.01}
      rps-threshold: {type: number, default: 0}
  workflow_call:
    inputs:
      locust-script: {type: string, required: true}
      target-host: {type: string, required: true}
      users: {type: number, default: 10}
      spawn-rate: {type: number, default: 1}
      run-time: {type: string, default: 1m}
      p95-threshold: {type: number, default: 500}
      p99-threshold: {type: number, default: 1000}
      error-rate-threshold: {type: number, default: 0.01}
      rps-threshold: {type: number, default: 0}
    secrets:
      SLACK_WEBHOOK_URL: {required: false}
      TEAMS_WEBHOOK_URL: {required: false}
    outputs:
      gate-passed: {value: '${{ jobs.quality-gate.outputs.gate-passed }}'}
      p95-max: {value: '${{ jobs.quality-gate.outputs.p95-max }}'}
      p99-max: {value: '${{ jobs.quality-gate.outputs.p99-max }}'}
      error-rate: {value: '${{ jobs.quality-gate.outputs.error-rate }}'}
      metrics-json: {value: '${{ jobs.quality-gate.outputs.metrics-json }}'}
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install .
      - run: locust -f '${{ inputs.locust-script }}' --headless -H '${{ inputs.target-host }}' -u '${{ inputs.users }}' -r '${{ inputs.spawn-rate }}' -t '${{ inputs.run-time }}' --csv results/run
      - uses: actions/upload-artifact@v4
        with: {name: locust-results, path: results/}
  generate-reports:
    needs: load-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: locust-results, path: results/}
      - run: echo generate reports
  quality-gate:
    needs: [load-test, generate-reports]
    runs-on: ubuntu-latest
    outputs:
      gate-passed: '${{ steps.gate.outputs.gate-passed }}'
      p95-max: '${{ steps.gate.outputs.p95-max }}'
      p99-max: '${{ steps.gate.outputs.p99-max }}'
      error-rate: '${{ steps.gate.outputs.error-rate }}'
      metrics-json: '${{ steps.gate.outputs.metrics-json }}'
    steps:
      - id: gate
        env:
          P95_THRESHOLD: '${{ inputs.p95-threshold }}'
          P99_THRESHOLD: '${{ inputs.p99-threshold }}'
          ERROR_RATE_THRESHOLD: '${{ inputs.error-rate-threshold }}'
          RPS_THRESH: '${{ inputs.rps-threshold }}'
        run: |
          GATE_PASSED="true"
          echo "Evaluate p95 p99 error rate threshold; RPS_THRESH != "0" enables RPS check"
          echo "gate-passed=true" >> "$GITHUB_OUTPUT"
          echo "p95-max=0" >> "$GITHUB_OUTPUT"
          echo "p99-max=0" >> "$GITHUB_OUTPUT"
          echo "error-rate=0" >> "$GITHUB_OUTPUT"
          echo 'metrics-json={}' >> "$GITHUB_OUTPUT"
          if [ "$GATE_PASSED" = "false" ]; then echo failure; exit 2; fi
  notify:
    if: always()
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - env:
          SLACK_WEBHOOK_URL: '${{ secrets.SLACK_WEBHOOK_URL }}'
          TEAMS_WEBHOOK_URL: '${{ secrets.TEAMS_WEBHOOK_URL }}'
          GATE_PASSED: '${{ needs.quality-gate.outputs.gate-passed }}'
        run: |
          if [ "$GATE_PASSED" = "true" ]; then echo PASSED; else echo FAILED; fi
          echo "SLACK_WEBHOOK_URL and TEAMS_WEBHOOK_URL are optional"
